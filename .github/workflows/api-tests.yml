
name: Trello API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
      timezone: 'Asia/Seoul'

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Trello API tests
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        run: |
          node -e '
          const fs = require("fs");

          const env = JSON.parse(
            fs.readFileSync("postman/trello.postman_environment.json", "utf8")
          );

          const values = {
            base_url: "https://api.trello.com",
            key: process.env.TRELLO_API_KEY,
            token: process.env.TRELLO_API_TOKEN
          };

          for (const variable of env.values) {
            if (variable.key in values) {
              variable.value = values[variable.key];
            }
          }

          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/trello_env_ci.json",
            JSON.stringify(env)
          );
          '

          newman run postman/trello.postman_collection.json \
            -e "$RUNNER_TEMP/trello_env_ci.json" \
            -r cli,junit \
            --reporter-junit-export "$RUNNER_TEMP/newman-results.xml"

      - name: Check report for credentials
        id: report_safety
        if: always()
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "newman-results.xml"

          if not report.is_file():
              print("Report was not generated.")
              sys.exit(1)

          content = report.read_bytes()

          for name in ("TRELLO_API_KEY", "TRELLO_API_TOKEN"):
              secret = os.environ.get(name, "")
              if not secret:
                  print(f"Missing secret: {name}")
                  sys.exit(1)
              if secret.encode() in content:
                  print(f"Credential detected in report: {name}")
                  sys.exit(1)

          print("Credential check passed.")
          PY

      - name: Upload Newman test report
        if: ${{ always() && steps.report_safety.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: newman-test-results
          path: ${{ runner.temp }}/newman-results.xml
          if-no-files-found: error
          retention-days: 7

      - name: Notify Slack
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          status = os.environ["JOB_STATUS"]
          report = Path(os.environ["RUNNER_TEMP"]) / "newman-results.xml"

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )

          success = status == "success"
          symbol = "✅" if success else "❌"
          label = "PASSED" if success else "FAILED"

          trigger_names = {
              "push": "Push",
              "schedule": "Scheduled",
              "workflow_dispatch": "Manual",
          }
          event_name = os.environ["GITHUB_EVENT_NAME"]
          trigger = trigger_names.get(event_name, event_name)

          def field(title, value):
              return {
                  "type": "mrkdwn",
                  "text": f"*{title}*\n{value}"
              }

          blocks = [
              {
                  "type": "header",
                  "text": {
                      "type": "plain_text",
                      "text": f"{symbol} Trello API Tests — {label}"
                  }
              }
          ]

          fields = [field("Trigger", trigger)]
          failures = []
          report_message = None

          if report.is_file():
              try:
                  root = ET.parse(report).getroot()
                  suites = root.findall(".//testsuite")
                  cases = root.findall(".//testcase")

                  skipped = 0

                  for suite in suites:
                      request_name = suite.get("name", "Unknown request")

                      for case in suite.findall("testcase"):
                          if case.find("skipped") is not None:
                              skipped += 1

                          if (
                              case.find("failure") is not None
                              or case.find("error") is not None
                          ):
                              failures.append(
                                  f"{request_name} — "
                                  f"{case.get('name', 'Unknown assertion')}"
                              )

                  passed = len(cases) - len(failures) - skipped

                  fields.extend([
                      field("API Requests", str(len(suites))),
                      field(
                          "Assertions",
                          f"{passed} passed · "
                          f"{len(failures)} failed · "
                          f"{skipped} skipped"
                      )
                  ])

                  duration = root.get("time")
                  if duration is not None:
                      fields.append(
                          field("Duration", f"{float(duration):.2f}s")
                      )

              except (ET.ParseError, ValueError):
                  report_message = (
                      "Test report could not be parsed. "
                      "Check workflow logs."
                  )
          else:
              report_message = (
                  "Test report unavailable. Check workflow logs."
              )

          blocks.append({
              "type": "section",
              "fields": fields
          })

          if failures:
              items = []

              for index, failure in enumerate(failures[:10], 1):
                  safe_name = (
                      failure.replace("&", "&amp;")
                             .replace("<", "&lt;")
                             .replace(">", "&gt;")
                  )
                  items.append(f"{index}. {safe_name}")

              remaining = len(failures) - 10
              if remaining > 0:
                  items.append(
                      f"...and {remaining} more failures"
                  )

              blocks.append({
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": (
                          f"*Failed Assertions ({len(failures)})*\n"
                          + "\n".join(items)
                      )
                  }
              })

          if report_message:
              blocks.append({
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": report_message
                  }
              })

          blocks.extend([
              {"type": "divider"},
              {
                  "type": "actions",
                  "elements": [
                      {
                          "type": "button",
                          "text": {
                              "type": "plain_text",
                              "text": "View GitHub Actions Run"
                          },
                          "url": run_url,
                          "action_id": "view_test_run"
                      }
                  ]
              }
          ])

          webhook = os.environ.get("SLACK_WEBHOOK_URL")
          if not webhook:
              raise RuntimeError("SLACK_WEBHOOK_URL is not configured")

          payload = {
              "text": f"{symbol} Trello API Tests — {label}",
              "blocks": blocks
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(
              request, timeout=15
          ) as response:
              print(
                  f"Slack notification sent: HTTP {response.status}"
              )
          PY
